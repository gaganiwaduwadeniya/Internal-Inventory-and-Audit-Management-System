services:
  - type: web
    name: equipment-management-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGO_URI
        scope: build,run
        sync: false
      - key: JWT_SECRET
        scope: build,run
        sync: false
    headers:
      - path: /api/*
        name: X-Frame-Options
        value: DENY
      - path: /api/*
        name: X-Content-Type-Options
        value: nosniff
      - path: /api/*
        name: X-XSS-Protection
        value: 1; mode=block
    healthCheckPath: /api/health
    preDeployCommand: npm install

env:
  - key: MONGO_URI
    description: MongoDB connection URI
    value: mongodb+srv://username:password@cluster.mongodb.net/equipment-management
  - key: JWT_SECRET
    description: JWT secret key for token signing
    value: your_jwt_secret_key_here
  - key: NODE_ENV
    value: production
